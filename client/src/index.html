<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handmade Jewelry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Sora:wght@100..800&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- Шапка сайту (може містити іконку кошика та посилання на адмінку) -->
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/hero.html" />
      
      <!-- 💎 СЕКЦІЯ КАТАЛОГУ (Сюди JavaScript завантажуватиме товари з бази) -->
      <section class="catalog-section" style="padding: 40px 20px;">
        <div class="container">
          <h2 style="margin-bottom: 24px; text-align: center;">Каталог прикрас</h2>
          
          <!-- Контейнер, куди JavaScript динамічно намалює картки товарів -->
          <div id="products-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
            <!-- Сюди за допомогою JS будуть вставлятися товари з бекенду -->
          </div>
        </div>
      </section>

      <load src="./partials/about-us.html" />
      <load src="./partials/benefits.html" />
      <load src="./partials/gallery.html" />
      <load src="./partials/testimonials.html" />
      <load src="./partials/contacts.html" />
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/mobile-menu.html" />

    <!-- Головний JS-скрипт проєкту -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
